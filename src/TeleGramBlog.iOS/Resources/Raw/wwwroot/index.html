<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>TeleBlog</title><link rel="stylesheet" href="reference.css"><link rel="stylesheet" href="mobile.css"><link rel="stylesheet" href="desktop.css"><script src="native-bridge.js"></script></head><body>  <main class="app boot-loading" id="app">
   <header class="app-header" id="header">
    <div class="topline">
     <div class="compact-title"><span class="mini-brand" data-icon="luma" aria-label="TeleBlog"></span><h2 id="pageTitle">ข้อความ</h2></div>
     <div class="heading-tools"><button class="icon-btn" id="refreshGroupsButton" data-refresh-groups aria-label="รีเฟรชกลุ่ม" data-icon="refresh" hidden></button><button class="plain-action" id="selectButton">เลือก</button><button class="icon-btn" id="options" aria-label="ปรับมุมมองและเรียงลำดับ" data-icon="sliders"></button><button class="avatar" id="profile" aria-label="บัญชีและการตั้งค่า">L</button></div>
    </div>
    <div class="scope-row" id="scopeRow"><button class="scope-btn" id="groupPicker">ทุกกลุ่ม <span data-icon="chevronDown"></span></button><span class="scope-dot" id="scopeDot"></span><button class="scope-btn" id="topicPicker">ทุกหัวข้อ <span data-icon="chevronDown"></span></button><span class="scope-btn" id="pageSubtitle" hidden></span></div>
    <label class="searchbox"><span data-icon="search"></span><input id="search" type="search" placeholder="ค้นหารูป กลุ่ม หรือหัวข้อ" aria-label="ค้นหารูป กลุ่ม หรือหัวข้อ" autocomplete="off"><button class="clear-search" id="clearSearch" type="button" aria-label="ล้างคำค้น" hidden data-icon="closeCircle"></button></label>

   </header>
   <div class="content" id="content" tabindex="-1"><div class="startup-loader" role="status" aria-label="กำลังเชื่อมต่อบัญชีเดิม"><div class="startup-mark"><span class="startup-track" aria-hidden="true"></span><span class="startup-orbit" aria-hidden="true"></span><img class="startup-logo" src="assets/teleblog-logo.svg" alt="TeleBlog" width="88" height="88"></div></div></div>
   <div class="bottom-haze"></div>
   <nav class="tabbar" aria-label="เมนูหลัก"><button class="tab" data-tab="groups"><span data-icon="albums"></span>กลุ่ม</button><button class="tab active" data-tab="library" aria-current="page"><span data-icon="grid"></span>ข้อความ</button><button class="tab" data-tab="saved"><span data-icon="heart"></span>เก็บไว้</button></nav>

   <div class="selection-bar" id="selectionBar" hidden><span id="selectionCount">เลือก 0 รายการ</span><button id="saveSelection"><span data-icon="heart"></span>เก็บไว้</button></div>
   <div class="toast" id="toast" role="status" aria-live="polite"></div>
   <dialog class="viewer" id="viewer" aria-label="ดูสื่อเต็มจอ"><div class="viewer-head"><button class="icon-btn" id="closeViewer" aria-label="กลับไปกริด" data-icon="arrowLeft"></button><div class="viewer-meta"><h3 id="viewerGroup"></h3><p id="viewerTopic"></p></div><button class="icon-btn" id="viewerInfo" aria-label="ข้อมูลสื่อ" data-icon="info"></button></div><button class="icon-btn" id="exitMediaFullscreen" aria-label="ย่อภาพกลับหน้าดูสื่อ" data-icon="collapse" hidden></button><div class="viewer-stage" id="viewerStage"><div class="viewer-count" id="viewerCount"></div><button class="viewer-arrow prev" id="prevMedia" aria-label="สื่อก่อนหน้า" data-icon="chevronLeft"></button><button class="viewer-arrow next" id="nextMedia" aria-label="สื่อถัดไป" data-icon="chevronRight"></button></div><div class="viewer-bottom"><div class="viewer-caption"><div><h3 id="viewerTitle"></h3><p id="viewerDate"></p></div><button class="zoom-button" id="zoomButton" aria-label="ขยายภาพ" data-icon="expand"></button></div><div class="filmstrip" id="filmstrip" aria-label="ภาพย่อ"></div><div class="viewer-actions"><button class="viewer-action" id="favorite"><span data-icon="heart"></span><span id="favoriteLabel">เก็บไว้</span></button><button class="viewer-action" id="download"><span data-icon="download"></span>แชร์ / บันทึก</button><button class="viewer-action" id="sourceInfo"><span data-icon="location"></span>ที่มา</button></div></div></dialog>
   <dialog class="sheet-dialog" id="sheet" aria-labelledby="sheetTitle"><div class="handle"></div><div class="sheet-heading"><h2 id="sheetTitle"></h2><button class="sheet-close" id="closeSheet" aria-label="ปิด" data-icon="close"></button></div><div id="sheetBody"></div></dialog>
  </main>
<script src="icons.js"></script><script type="module" src="app.mjs"></script></body></html>
